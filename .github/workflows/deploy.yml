name: Deploy StockWatch to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare project
        run: |
          mkdir -p build
          unzip -q stockwatch-nextjs.zip -d build
          test -f build/stockwatch/package.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build/stockwatch/next.config.ts")
          if p.exists():
              s = p.read_text()
              if 'output:' not in s:
                  s, n = re.subn(r'(const\\s+nextConfig\\s*:\\s*NextConfig\\s*=\\s*\\{)', r'\\1\\n  output: "export",\\n  basePath: "/stockwatch",\\n  assetPrefix: "/stockwatch",\\n  images: { unoptimized: true },', s, count=1)
                  if n != 1:
                      raise SystemExit("Could not configure next.config.ts for static export")
                  p.write_text(s)
          else:
              raise SystemExit("next.config.ts missing from project archive")
          PY
      - name: Install dependencies
        working-directory: build/stockwatch
        run: npm install
      - name: Build static site
        working-directory: build/stockwatch
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/stockwatch/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
